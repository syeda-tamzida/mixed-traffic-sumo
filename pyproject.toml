[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mixed-traffic-sumo"
version = "0.2.0"
description = "Real-world mixed (heterogeneous) traffic scenarios for SUMO and reinforcement-learning traffic signal control"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Syeda Tamzida Akter"}]
requires-python = ">=3.9"
keywords = ["SUMO", "traffic simulation", "reinforcement learning", "traffic signal control", "heterogeneous traffic", "Bangladesh", "mixed traffic"]
dependencies = ["sumo-rl>=1.4", "eclipse-sumo"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Scientific/Engineering"]

[project.optional-dependencies]
train = ["stable-baselines3>=2.0"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/syeda-tamzida/mixed-traffic-sumo"

[tool.setuptools.packages.find]
include = ["mixed_traffic_sumo*"]

[tool.setuptools.package-data]
mixed_traffic_sumo = ["scenarios/*/*"]
